<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D4A2F">
<title>بياناتي · لَمّة سمول ڤاميلي</title>
<meta property="og:title" content="لَمّة سمول ڤاميلي 🤍">
<meta property="og:description" content="عشان جائزتك توصلك على طول وبدون إحراج 🤍">
<meta property="og:image" content="https://abdullhj-design.github.io/lamma-games/icon-512.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@400;600&display=swap">
<style>
:root{--bg:#FBF6EF;--surface:#FFFFFF;--ink:#231A15;--muted:#6F6158;--line:#E8DDD0;--red:#B3261E;--green:#2E6A4C;--ochre:#C4851A;--band:#231A15;
  --display:'Lalezar','Readex Pro',Tahoma,sans-serif;--body:'Readex Pro','Segoe UI',Tahoma,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
.sadu{height:20px;background:conic-gradient(from 135deg at 50% 0,var(--ochre) 90deg,transparent 0) 0 0/20px 10px repeat-x,conic-gradient(from -45deg at 50% 100%,var(--red) 90deg,transparent 0) 10px 10px/20px 10px repeat-x,var(--band)}
main{max-width:520px;margin:0 auto;padding:22px max(18px,env(safe-area-inset-left,0px)) 40px}
h1{font-family:var(--display);font-weight:400;font-size:2.2rem;margin:6px 0 4px;line-height:1.2}
.lead{margin:0 0 18px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:16px}
label{display:block;font-weight:600;margin-bottom:6px}
.hint{font-weight:400;color:var(--muted);font-size:.85rem}
input,textarea{width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
input:focus,textarea:focus{outline:none;border-color:var(--ochre)}
textarea{min-height:96px;resize:vertical}
.ltr{direction:ltr;text-align:left;letter-spacing:.04em}
.err{color:var(--red);font-size:.9rem;margin-top:6px}
.qr{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.qr img{width:110px;height:110px;object-fit:contain;border:1px solid var(--line);border-radius:10px;background:#fff}
.btn{font:inherit;font-weight:600;border:0;border-radius:14px;padding:14px 18px;cursor:pointer}
.btn-main{background:var(--green);color:#fff;font-size:1.15rem;width:100%}
.btn-main:disabled{opacity:.6}
.btn-soft{background:#F4ECDC;color:var(--ink)}
.btn-link{background:none;color:var(--red);padding:6px 4px}
.done{text-align:center;padding:30px 10px}
.done .big{font-size:4rem;line-height:1.1}
.done h2{font-family:var(--display);font-weight:400;font-size:2rem;margin:8px 0}
</style>
</head>
<body>
<div class="sadu"></div>
<main id="m"><p class="lead">جاري التحميل…</p></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="lamma-firebase.js"></script>
<script>
const m=document.getElementById('m');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toLat=s=>String(s||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
const ibanClean=s=>toLat(s).toUpperCase().replace(/[^A-Z0-9]/g,'');
function ibanPick(v){const t=toLat(v).toUpperCase();let from=0;while(true){const i=t.indexOf('SA',from);if(i<0)return null;let d='';for(let k=i+2;k<t.length&&d.length<22;k++){const c=t[k];if(c>='0'&&c<='9')d+=c;else if(/[A-Z؀-ۿ]/.test(c))break}if(d.length===22)return 'SA'+d;from=i+2}}
const ibanFmt=x=>x.replace(/(.{4})/g,'$1 ').trim();
let qr='',prev=null;
function form(d){d=d||{};qr=d.qr||'';
  if(d.name&&d.t){done();return}
  m.innerHTML=`<h1>لَمّة سمول ڤاميلي 🤍</h1>
  <p class="lead">عشان جائزتك توصلك 🏆</p>
  <form class="card" id="f" novalidate>
    <div><label for="name">الاسم</label><input id="name" maxlength="40" autocomplete="name" value="${esc(d.name)}"><div class="err" id="e_name" hidden></div></div>
    <div><label for="iban">الآيبان</label><input id="iban" class="ltr" inputmode="text" autocapitalize="characters" autocomplete="off" value="${esc(d.iban)}" placeholder="SA0000000000000000000000"><div class="err" id="e_iban" hidden></div></div>
    <div><label for="bank">البنك</label><input id="bank" maxlength="40" value="${esc(d.bank)}"><div class="err" id="e_bank" hidden></div></div>
    <div><label>📷 QR <span class="hint">(اختياري)</span></label>
      <div class="qr" id="qrbox"></div><input type="file" id="qrf" accept="image/*" hidden></div>
    <div class="err" id="e_all" hidden></div>
    <button class="btn btn-main" id="send" type="submit">إرسال</button>
  </form>`;
  drawQr();
  document.getElementById('qrf').onchange=e=>{const f=e.target.files&&e.target.files[0];if(f)shrink(f)};
  document.getElementById('f').onsubmit=e=>{e.preventDefault();send()};
  ['name','iban','bank'].forEach(k=>document.getElementById(k).oninput=()=>showErr('e_'+k,''));
  const ib=document.getElementById('iban');ib.addEventListener('input',()=>{const x=ibanPick(ib.value);if(x){const f=ibanFmt(x);if(ib.value!==f)ib.value=f}});
}
function done(){m.innerHTML=`<div class="done"><div class="big">🤍</div><h2>وصلت</h2></div>`}
function drawQr(){const b=document.getElementById('qrbox');
  b.innerHTML=qr?`<img src="${qr}" alt="QR"><button type="button" class="btn btn-soft" id="qrc">غيّر الصورة</button><button type="button" class="btn btn-link" id="qrd">شيلها</button>`
    :`<button type="button" class="btn btn-soft" id="qrc">📷 أرفق QR</button>`;
  document.getElementById('qrc').onclick=()=>document.getElementById('qrf').click();
  const d=document.getElementById('qrd');if(d)d.onclick=()=>{qr='';drawQr()};}
function shrink(file){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const max=900,k=Math.min(1,max/Math.max(im.width,im.height));
  const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
  let q=.9,u=c.toDataURL('image/jpeg',q);while(u.length>380000&&q>.4){q-=.1;u=c.toDataURL('image/jpeg',q)}
  if(u.length>380000){alert('الصورة كبيرة، جرّب سكرين شوت أصغر');return}qr=u;drawQr()};im.onerror=()=>alert('ما قدرت أفتح الصورة، جرّب صورة ثانية');im.src=r.result};r.readAsDataURL(file)}
function showErr(id,t){const e=document.getElementById(id);e.textContent=t||'';e.hidden=!t}
async function send(){const name=document.getElementById('name').value.trim().replace(/\s+/g,' '),iban=ibanPick(document.getElementById('iban').value)||ibanClean(document.getElementById('iban').value),bank=document.getElementById('bank').value.trim();
  const okI=/^SA[0-9]{22}$/.test(iban);
  showErr('e_name',name?'':'اكتب اسمك');showErr('e_iban',!iban?'اكتب الآيبان':okI?'':'الآيبان يبدأ بـ SA وبعده 22 رقم');showErr('e_bank',bank?'':'اكتب اسم البنك');showErr('e_all','');
  if(!name||!okI||!bank)return;
  const d={name,iban,bank:bank.slice(0,40)};if(qr)d.qr=qr;
  const b=document.getElementById('send');b.disabled=true;b.textContent='جاري الإرسال…';
  try{if(!window.lamma||!lamma.sendForm)throw new Error('offline');await lamma.sendForm(d);done()}
  catch(e){b.disabled=false;b.textContent='إرسال';showErr('e_all','ما وصلت 😕 تأكد من النت وجرّب مرة ثانية')}}
(async()=>{let d=null;try{if(window.lamma&&lamma.myForm)d=await lamma.myForm()}catch(e){}form(d)})();
</script>
</body>
</html>
