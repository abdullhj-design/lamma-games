<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D4A2F">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>لَمّة سمول ڤاميلي</title>
<meta name="description" content="لمّتنا أحلى.. يلا نلعب ونتحدى! 🎉">
<meta property="og:title" content="لَمّة سمول ڤاميلي">
<meta property="og:description" content="لمّتنا أحلى.. يلا نلعب ونتحدى! 🎉">
<meta property="og:image" content="https://abdullhj-design.github.io/lamma-games/icon-512.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@400;600&display=swap">
<style>
/* Layout: a majlis game board — Sadu-weave band on top, team score rail, one big game stage. Host = projector, player = phone, admin = content editor. */
:root{
  --bg:#FBF6EF; --surface:#FFFFFF; --ink:#231A15; --muted:#6F6158; --line:#E8DDD0;
  --red:#B3261E; --red-soft:#F7E2DE; --green:#2E6A4C; --green-soft:#DCEDE3;
  --ochre:#C4851A; --on-accent:#FFFFFF; --band:#231A15; --nat:#1D4A2F; --on-nat:#FFFFFF;
  --display:'Lalezar','Readex Pro',Tahoma,sans-serif;
  --body:'Readex Pro','Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16110E; --surface:#211A16; --ink:#F4ECE3; --muted:#B4A698; --line:#3A2F29;
  --red:#E5594C; --red-soft:#3B201C; --green:#52AB7F; --green-soft:#1B3328;
  --ochre:#E8AA3C; --on-accent:#16110E; --band:#0D0A08; --nat:#173B26; --on-nat:#F4ECE3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16110E; --surface:#211A16; --ink:#F4ECE3; --muted:#B4A698; --line:#3A2F29;
  --red:#E5594C; --red-soft:#3B201C; --green:#52AB7F; --green-soft:#1B3328;
  --ochre:#E8AA3C; --on-accent:#16110E; --band:#0D0A08; --nat:#173B26; --on-nat:#F4ECE3; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
*{box-sizing:border-box}
#app{max-width:1100px;margin:0 auto;padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sadu{height:20px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));background:
  conic-gradient(from 135deg at 50% 0,var(--ochre) 90deg,transparent 0) 0 0/20px 10px repeat-x,
  conic-gradient(from -45deg at 50% 100%,var(--red) 90deg,transparent 0) 10px 10px/20px 10px repeat-x,var(--band)}
h1,h2,h3,.disp{font-family:var(--display);font-weight:400;margin:0;line-height:1.25;text-wrap:balance}
button{font-family:var(--body);font-size:1rem;cursor:pointer;border-radius:12px;padding:12px 18px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,label.up:focus-within{outline:3px solid var(--ochre);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-red{background:var(--red);color:var(--on-accent);border-color:var(--red)}
.btn-green{background:var(--green);color:var(--on-accent);border-color:var(--green)}
.btn-ink{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn-big{font-size:1.25rem;padding:16px 26px;font-weight:600}
input,select,textarea{font-family:var(--body);font-size:1rem;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);min-width:0}
textarea{width:100%;min-height:150px;resize:vertical;line-height:1.7}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:18px 8px}
.brand{font-family:var(--display);font-size:2rem;line-height:1}
.brand small{display:block;font-family:var(--body);font-size:.8rem;color:var(--muted);margin-top:6px}
.link{background:none;border:0;padding:6px;color:var(--muted);text-decoration:underline;font-size:.9rem}
.link.strong{color:var(--ink);font-weight:600}
.link.danger{color:var(--red)}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-block:10px 22px}
.team{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;min-width:0}
.team.t0{background:var(--red-soft)} .team.t1{background:var(--green-soft)}
.team .tn{flex:1;min-width:0;font-weight:600;background:transparent;border:0;padding:4px;font-size:1.05rem}
.team .ts{font-family:var(--display);font-size:2.4rem;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.t0 .ts{color:var(--red)} .t1 .ts{color:var(--green)}
.team button{padding:6px 12px;font-size:1.2rem;line-height:1}
@media (max-width:520px){.scores{grid-template-columns:1fr}}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.game{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:10px}
.game h2{font-size:1.9rem}
.game p{margin:0;color:var(--muted);flex:1}
.game.ev{background:var(--nat);border-color:var(--nat);color:var(--on-nat)}
.game.ev p,.game.ev .tag{color:var(--on-nat);opacity:.85}
.game.ev .tag{border-color:color-mix(in srgb,var(--on-nat) 40%,transparent)}
.game.ev button{background:var(--on-nat);color:var(--nat);border-color:var(--on-nat)}
.tag{display:inline-block;font-size:.78rem;letter-spacing:.02em;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 10px;width:fit-content}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:20px;margin-top:18px}
.panel h3{font-size:1.4rem;margin-bottom:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-block:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 6px 6px 12px;border-radius:99px;background:var(--bg);border:1px solid var(--line)}
.chip button{padding:2px 9px;border-radius:99px;font-size:.9rem;border:0;background:var(--line)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dot.t0{background:var(--red)} .dot.t1{background:var(--green)}
.muted{color:var(--muted)} .small{font-size:.88rem}
.stage{background:var(--surface);border:1.5px solid var(--line);border-radius:24px;padding:clamp(18px,4vw,40px);text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px}
.stage .eyebrow{font-size:.9rem;color:var(--muted);letter-spacing:.03em}
.huge{font-family:var(--display);font-size:clamp(3rem,11vw,7.5rem);line-height:1.1;overflow-wrap:anywhere}
.big{font-family:var(--display);font-size:clamp(2rem,6vw,3.6rem);line-height:1.2;overflow-wrap:anywhere}
.mid{font-family:var(--display);font-size:clamp(1.6rem,4.4vw,2.6rem);line-height:1.35;overflow-wrap:anywhere;white-space:pre-line}
.timer{font-family:var(--display);font-size:clamp(2.4rem,7vw,4.5rem);font-variant-numeric:tabular-nums;color:var(--ochre)}
.timer.low{color:var(--red)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;width:100%}
.opts button{font-size:1.15rem;padding:14px}
.opts .right{background:var(--green);color:var(--on-accent);border-color:var(--green)}
.opts .wrong{background:var(--red);color:var(--on-accent);border-color:var(--red)}
.order{list-style:none;padding:0;margin:0;width:100%;max-width:520px;display:flex;flex-direction:column;gap:8px}
.order button,.order .ob{width:100%;display:flex;align-items:center;gap:12px;font-size:1.2rem;text-align:start;padding:10px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
.order .n{font-family:var(--display);font-size:1.6rem;width:1.6em;color:var(--muted)}
.back{margin-bottom:14px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted)}
.status .dot{background:var(--muted)} .status.on .dot{background:var(--green)}
.choose{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:20px}
.choose button{padding:28px 22px;border-radius:22px;text-align:start;display:flex;flex-direction:column;gap:6px}
.choose b{font-family:var(--display);font-weight:400;font-size:1.9rem}
.choose button{justify-content:center;min-height:120px}
.phone{max-width:460px;margin:0 auto}
.reveal-card{width:100%;min-height:220px;border-radius:24px;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;font-size:1.1rem}
.reveal-card.spy{border:2px solid var(--red);background:var(--red-soft)}
.reveal-card.word{border:2px solid var(--green);background:var(--green-soft)}
.buzzer{width:min(72vw,280px);aspect-ratio:1;max-width:100%;border-radius:50%;font-family:var(--display);font-size:2.6rem;background:var(--red);color:var(--on-accent);border:8px solid var(--red-soft);box-shadow:0 10px 0 color-mix(in srgb,var(--red) 60%,var(--ink))}
.buzzer:active:not(:disabled){transform:translateY(6px);box-shadow:0 4px 0 color-mix(in srgb,var(--red) 60%,var(--ink))}
.teampick{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.teampick .sel.t0{background:var(--red);color:var(--on-accent);border-color:var(--red)}
.teampick .sel.t1{background:var(--green);color:var(--on-accent);border-color:var(--green)}
/* event */
.evstage{background:var(--nat);color:var(--on-nat);border-color:var(--nat)}
.evstage .eyebrow{color:var(--on-nat);opacity:.8}
.evstage button:not(.btn-red):not(.btn-green){background:transparent;color:var(--on-nat);border-color:color-mix(in srgb,var(--on-nat) 45%,transparent)}
.evstage .btn-ink{background:var(--on-nat)!important;color:var(--nat)!important;border-color:var(--on-nat)!important}
.evstage .link{color:var(--on-nat);border:0!important}
.media{max-width:100%;max-height:55vh;border-radius:16px;background:#000;display:block}
img.media{background:transparent}
.teambadge{display:inline-flex;align-items:center;gap:8px;padding:4px 14px;border-radius:99px;font-weight:600;background:color-mix(in srgb,var(--on-nat) 14%,transparent)}
.teambadge.t0{background:var(--red);color:var(--on-accent)} .teambadge.t1{background:var(--green);color:var(--on-accent)}
.rounds{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;width:100%}
.rounds button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:start;padding:14px;border-radius:16px;min-height:96px}
.rounds .rn{font-family:var(--display);font-size:1.6rem;line-height:1}
.rounds .done{opacity:.55}
.rounds .done .rn::after{content:" ✓"}
.extlink{color:var(--on-nat);font-weight:600}
.progress{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.progress span{width:10px;height:10px;border-radius:50%;background:color-mix(in srgb,var(--on-nat) 30%,transparent)}
.progress span.on{background:var(--on-nat)}
/* judges */
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
.scale button{padding:10px 0;font-size:1.15rem;font-variant-numeric:tabular-nums}
.picks{display:flex;flex-direction:column;gap:10px;width:100%}
.picks button{font-size:1.2rem;padding:16px;text-align:start;font-weight:600}
.picks .sel{background:var(--nat);color:var(--on-nat);border-color:var(--nat)}
.scale .sel{background:var(--nat);color:var(--on-nat);border-color:var(--nat)}
.jcard{width:100%;text-align:start;border:1.5px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px}
.jname{font-family:var(--display);font-size:1.4rem;line-height:1.2}
.jsend{position:sticky;bottom:0;width:100%;background:var(--surface);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
.wincard{position:relative;overflow:hidden}
.drawcols{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.drawcol{border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.drawcol.t0{background:var(--red-soft)} .drawcol.t1{background:var(--green-soft)}
.drawcol .dh{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.drawcol .dh b{font-family:var(--display);font-weight:400;font-size:1.8rem}
.drawcol.t0 .dh b{color:var(--red)} .drawcol.t1 .dh b{color:var(--green)}
.dl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.dn{padding:8px 14px;border-radius:99px;font-size:1.1rem;font-weight:600}
.dn.new{animation:pop .5s ease-out;border-color:var(--ochre);box-shadow:0 0 0 3px color-mix(in srgb,var(--ochre) 45%,transparent)}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.myteam{width:100%;border-radius:20px;padding:22px;font-size:1.15rem;display:flex;flex-direction:column;gap:4px}
.myteam b{font-family:var(--display);font-weight:400;font-size:clamp(2rem,9vw,2.8rem);line-height:1.2}
.myteam.t0{background:var(--red);color:var(--on-accent)} .myteam.t1{background:var(--green);color:var(--on-accent)}
@media (max-width:520px){.drawcols{grid-template-columns:1fr}}
.wincard .huge{color:var(--ochre)}
.thanks{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding-block:10px}
.prize{margin:6px 0 0;max-width:52ch;font-size:clamp(1.05rem,2.6vw,1.4rem);line-height:1.7}
.members{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:680px}
.members span{padding:6px 14px;border-radius:99px;font-size:1.1rem;background:color-mix(in srgb,var(--on-nat) 14%,transparent)}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;top:-16px;width:8px;height:14px;border-radius:2px;opacity:.9;animation-name:fall;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}}
.podium{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;width:100%;max-width:760px}
.pod{border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:4px;align-items:center;border:1.5px solid var(--line)}
.pod b{font-family:var(--display);font-weight:400;font-size:1.6rem;line-height:1.2}
.pod .pr{font-size:.85rem;color:var(--muted)}
.pod .pv{font-family:var(--display);font-size:2rem;font-variant-numeric:tabular-nums}
.pod .pv small{font-size:.9rem;color:var(--muted)}
.pod.p1{background:var(--nat);color:var(--on-nat);border-color:var(--nat)}
.pod.p1 .pr,.pod.p1 .pv small{color:var(--on-nat);opacity:.8}
.pod.p1 .pv{color:var(--ochre)}
.jtab{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.jtab th,.jtab td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:center}
.jtab th:first-child,.jtab td:first-child{text-align:start}
.jtab th{font-size:.85rem;color:var(--muted);font-weight:600}
/* admin */
.admin{display:flex;flex-direction:column;gap:16px}
.admin .panel{margin-top:0;display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-weight:600;font-size:.95rem}
.hint{font-size:.82rem;color:var(--muted)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.cat{border:1.5px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg);min-width:0}
.cat textarea{min-height:130px}
.toggle{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--green)}
.rhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;width:100%;justify-content:space-between}
.rhead .rt{flex:1;min-width:0;text-align:start;font-weight:600;background:none;border:0;padding:6px 0;font-size:1.05rem}
.item{border:1.5px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px;background:var(--surface)}
.item textarea{min-height:64px}
.igrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.mslot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1.5px dashed var(--line);border-radius:12px;padding:8px}
.mslot img,.mslot video{width:84px;height:60px;object-fit:cover;border-radius:8px;background:#000}
label.up{display:inline-flex;align-items:center;gap:6px;cursor:pointer;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);font-size:.9rem;background:var(--bg)}
label.up input{position:absolute;opacity:0;width:1px;height:1px}
.savebar{position:sticky;bottom:0;background:var(--bg);border-top:1.5px solid var(--line);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:5}
.savebar .msg{flex:1;min-width:180px;font-size:.92rem}
.msg.ok{color:var(--green)} .msg.err{color:var(--red)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:20;max-width:90vw}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div id="app" dir="rtl" lang="ar"></div>
<div id="toast" class="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="config.js"></script>
<script src="lamma-firebase.js"></script>
<script type="application/json" id="defaults">
{
 "title": "لَمّة سمول ڤاميلي",
 "games": {"spy": true, "charades": true, "buzz": true, "bell": true},
 "spyMin": 3,
 "chDur": 60,
 "cats": [
  {"name": "أكلات", "words": ["كبسة","مندي","جريش","قرصان","مطازيز","معصوب","مرقوق","سليق","شاورما","بيتزا","سمبوسة","لقيمات","هريس","مضغوط","برجر","فول"]},
  {"name": "أماكن", "words": ["المطار","المستشفى","المدرسة","البحر","الاستراحة","البر","المول","الملعب","المطعم","البنك","الحلاق","السينما","محطة البنزين","الجامعة","حديقة الحيوان","السوبرماركت"]},
  {"name": "مهن", "words": ["طبيب","طيار","معلم","مهندس","طباخ","ميكانيكي","شرطي","محامي","مصور","حلاق","نجار","رائد فضاء","صيدلي","مذيع","خباز","إطفائي"]},
  {"name": "حيوانات", "words": ["جمل","صقر","حصان","قطة","ذئب","ضب","غزال","أسد","فيل","زرافة","دلفين","نعامة","تمساح","بطريق","قرد","ثعلب"]},

async function uploadSound(file){
  if(file.size>20*1024*1024){S.saveOk=false;S.saveMsg=`الملف حجمه ${(file.size/1048576).toFixed(1)} ميغا، والحد ٢٠ ميغا. قصّه وجرّب مرة ثانية.`;render();return}
  if(!assetsNS){S.saveOk=false;S.saveMsg='رفع الملفات غير مفعّل بعد في هذا الموقع.';render();return}
  S.uploading.snd=1;S.saveMsg='';render();
  try{const res=await assetsNS.upload(file);D.winSound={url:res.url,name:clean(file.name,60)};S.saveOk=true;S.saveMsg='انرفع الصوت ✓ اسمعه من المشغّل، ولا تنسى تضغط «احفظ».'}
  catch(e){const c=e&&e.code;S.saveOk=false;S.saveMsg=c==='unsupported_type'?'هذا النوع من ملفات الصوت ما ينقبل هنا. حوّله لفيديو MP4 (مثلاً من كانفا: صفحة فاضية مع الصوت ← تنزيل MP4) وارفعه.':c==='quota_exceeded'?'امتلت مساحة الموقع.':'ما انرفع — تأكد من الاتصال وجرّب مرة ثانية.'}
  delete S.uploading.snd;render();
}
async function uploadMedia(key,file){
  const kind=file.type.startsWith('video/')?'video':file.type.startsWith('image/')?'image':null;
  if(!kind){S.saveOk=false;S.saveMsg='الملف لازم يكون صورة أو مقطع فيديو.';render();return}
  if(file.size>20*1024*1024){S.saveOk=false;S.saveMsg=`الملف «${file.name}» حجمه ${(file.size/1048576).toFixed(1)} ميغا، والحد ٢٠ ميغا. قصّه أو صدّره بجودة أقل وجرّب مرة ثانية.`;render();return}
  if(!assetsNS){S.saveOk=false;S.saveMsg='رفع الملفات غير مفعّل بعد في هذا الموقع.';render();return}
  S.uploading[key]=1;S.saveMsg='';render();
  try{
    const res=await assetsNS.upload(file);
    const path=key.split('.');let o=D;for(let i=0;i<path.length-1;i++)o=o[path[i]];o[path[path.length-1]]={url:res.url,kind};
    S.saveOk=true;S.saveMsg='انرفع ✓ لا تنسى تضغط «احفظ».';
  }catch(e){const c=e&&e.code;S.saveOk=false;
    S.saveMsg=c==='unsupported_type'?'نوع الملف مو مدعوم. جرّب MP4 للمقاطع أو JPG/PNG للصور.':c==='too_large'||c==='payload_too_large'?'الملف أكبر من الحد المسموح (٢٠ ميغا).':c==='quota_exceeded'?'امتلت مساحة الموقع. شيل مقاطع قديمة وجرّب.':c==='not_granted'?'ما عندك صلاحية الرفع.':'ما انرفع — تأكد من الاتصال وجرّب مرة ثانية.'}
  delete S.uploading[key];render();
}
async function saveAdmin(){
  const raw=fromDraft();if(problems(raw).length)return;
  if(D.pinNew||D.ppinNew||D.jpinNew){try{if(D.pinNew)raw.hostPin=await pinHash(D.pinNew);if(D.ppinNew)raw.playerPin=await pinHash(D.ppinNew,'diwaniya-player:');if(D.jpinNew)raw.judgePin=await pinHash(D.jpinNew,'diwaniya-judge:')}catch(e){S.saveOk=false;S.saveMsg='ما قدرت أحفظ الرقم السري من هذا المتصفح.';render();return}}
  const n=normalize(raw);
  S.saving=true;S.saveMsg='';render();
  try{
    const art=await window.claude.use('artifact');
    if(!art)throw{code:'not_granted'};
    if(window.lamma){if(D.pinNew)await lamma.setSecret('hostPin',D.pinNew);else if(!n.hostPin)await lamma.setSecret('hostPin',null)}
    await art.publish({'content.json':{content:JSON.stringify(n,null,1),contentType:'application/json'}});
    C=n;applyContent();D.events=clone(C.events);D.hostPin=C.hostPin;D.pinNew='';if(C.hostPin)LS.set('hostOk',C.hostPin);D.playerPin=C.playerPin;D.ppinNew='';D.judgePin=C.judgePin;D.jpinNew='';S.saveOk=true;S.saveMsg='انحفظ ✓ كل اللي يفتحون الموقع بيشوفون التعديلات.';
  }catch(e){
    S.saveOk=false;const c=e&&e.code;
    S.saveMsg=c==='conflict'?'أحد ثاني حفظ قبلك — الصفحة بتنعاد. عدّل من جديد بعدها.'
      :c==='not_writer'||c==='not_granted'?'ما عندك صلاحية تعديل هذا الموقع.'
      :c==='capability_disabled'?'الحفظ مو متاح من هذا العرض. افتح الموقع من claude.ai وأنت مسجل دخول.'
      :'ما انحفظ — تأكد من الاتصال وجرّب مرة ثانية.';
  }
  S.saving=false;render();
}

  else if(mode==='buzz'&&h.buzz)body=buzzer();
  else if(mode==='bell')body=`<h2 class="big">فقرة الجرس 🔔</h2>${h.buzz?buzzer():'<p class="muted" style="margin:0">استنى المقدّم يفتح الجرس.</p>'}`;
  else if(mode==='event'&&h.ev)body=`<span class="eyebrow">${esc(clean(h.ev.title,60))}</span><h2 class="big">${esc(clean(h.ev.round,60))||'تابعوا الشاشة'}</h2>${h.buzz?buzzer():'<p class="muted" style="margin:0">تابعوا الشاشة الكبيرة.</p>'}`;
  else if(mode==='charades'&&h.ch)body=`<h2 class="big">مثّلها</h2><p style="margin:0">الدور على ${tn(h.ch.team)} — تابعوا الشاشة الكبيرة.</p>`;
  else body=P.team===null?`<h2 class="big">انضميت ✓</h2><p style="margin:0;font-size:1.15rem">انتظر القرعة 🎲</p>`:`<div class="myteam t${P.team}">أنت في<b>${tn(P.team)}</b></div><p class="muted" style="margin:0">بانتظار المقدّم يختار اللعبة.</p>`;
  const sc=h.teams?`<div class="teampick">${h.teams.map((t,i)=>`<div class="team t${i}" style="justify-content:space-between"><span>${esc(t.name)}</span><span class="ts" style="font-size:1.8rem">${Number(t.score)||0}</span></div>`).join('')}</div>`:'';
  return head+`<div class="phone stage"><span class="eyebrow">${P.team===null?'':`<span class="dot t${P.team}"></span> `}${esc(P.name)}${P.team===null?'':' · '+tn(P.team)}</span>${body}${sc}</div>`;
}

/* ---------- timers ---------- */
function fmt(ms){const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function tick(){
  const now=Date.now();
  document.querySelectorAll('[data-end]').forEach(el=>{const left=+el.dataset.end-now;el.textContent=fmt(left);el.classList.toggle('low',left<10000)});
  if(role==='host'&&S.view==='charades'&&S.ch.stage==='play'&&now>=S.ch.end){S.ch.stage='done';S.teams[S.ch.team].score+=S.ch.got.length;saveTeams();beep(440,.8);emitState();render()}
  if(role==='host'&&S.view==='spy'&&S.spy&&S.spy.stage==='play'&&S.spy.end&&now>=S.spy.end&&!S.spy.beeped){S.spy.beeped=true;beep(440,.8)}
  if(role==='host'&&S.view==='event'&&S.ev&&S.ev.end&&now>=S.ev.end&&!S.ev.beeped){S.ev.beeped=true;beep(440,.8)}
}
setInterval(tick,250);
let wake=null;async function keepAwake(){try{if(navigator.wakeLock&&!wake){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>wake=null)}}catch(e){}}

/* ---------- events ---------- */
function evSetItem(i,phase='q'){const v=S.ev;v.ii=i;v.phase=phase;v.end=0;v.beeped=false;v.awarded=false;closeBuzz();emitState();render();window.scrollTo({top:0})}
function getD(path){return path.split('.').reduce((o,k)=>o[k],D)}
$app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;
  switch(act){
    case 'role':role=b.dataset.v||null;LS.set('role',role);if(role)keepAwake();if(role==='host'){S.view='home';emitState()}if(role!=='player'&&room&&P.joined){room.presence({role:null,buzz:null}).catch(()=>{});P.joined=false}if(role!=='judge'&&room&&J.joined){room.presence({role:null,vote:null}).catch(()=>{});J.joined=false}S.pinMsg='';render();break;
    case 'go':S.view=b.dataset.v;closeBuzz();emitState();render();break;
    case 'pt':{const t=S.teams[+b.dataset.t];t.score=Math.max(0,t.score+ +b.dataset.d);saveTeams();emitState();render();break}
    case 'resetScores':S.teams.forEach(t=>t.score=0);saveTeams();emitState();render();toast('صفّرنا النقاط');break;
    case 'rmLocal':S.locals.splice(+b.dataset.i,1);S.localsExample=false;LS.set('locals',S.locals);render();break;
    /* event */
    case 'evOpen':{const i=+b.dataset.i;if(!S.ev||S.ev.ei!==i)S.ev={ei:i,phase:'cover',ri:-1,ii:0,done:{},end:0};S.view='event';closeBuzz();emitState();render();break}
    case 'evGo':S.ev.phase=b.dataset.p;S.ev.ri=-1;closeBuzz();emitState();render();window.scrollTo({top:0});break;
    case 'evRound':S.ev.ri=+b.dataset.i;S.ev.phase='round';emitState();render();window.scrollTo({top:0});break;
    case 'evItem':evSetItem(+b.dataset.i);break;
    case 'evReveal':S.ev.phase='a';S.bz.open=false;emitState();render();break;
    case 'evBack':S.ev.phase='q';emitState();render();break;
    case 'evTimer':S.ev.end=Date.now()+C.events[S.ev.ei].rounds[S.ev.ri].timer*1000;S.ev.beeped=false;render();break;
    case 'evBuzz':S.bz.used=true;S.bz.open=!S.bz.open;if(S.bz.open){S.bz.r++;S.bz.order=[]}emitState();render();break;
    case 'evAward':{const t=+b.dataset.t;S.teams[t].score++;S.ev.awarded=true;saveTeams();emitState();toast('نقطة لـ '+S.teams[t].name);render();break}
    case 'evNext':{const r=C.events[S.ev.ei].rounds[S.ev.ri];if(S.ev.ii<r.items.length-1)evSetItem(S.ev.ii+1);else{S.ev.done[S.ev.ri]=1;S.ev.phase='menu';S.ev.ri=-1;closeBuzz();emitState();render();window.scrollTo({top:0})}break}
    /* spy */
    case 'spyStart':startSpy();break;
    case 'spyShow':S.spy.shown=true;render();break;
    case 'spyNext':S.spy.shown=false;S.spy.idx++;if(S.spy.idx>=S.spy.locals.length){S.spy.stage='play';S.spy.end=Date.now()+C.spyMin*60000}render();break;
    case 'spyAsk':{const l=S.spy.list;if(l.length<2)break;const a=pick(l);let c;do{c=pick(l)}while(c===a);S.spy.ask=[a.name,c.name];render();break}
    case 'spyEnd':S.spy.stage='result';emitState();render();break;
    case 'spyGuess':S.spy.guess=S.spy.opts[+b.dataset.i];if(S.spy.guess===S.spy.word)beep(880,.4);render();break;
    case 'spyReset':S.spy=null;emitState();render();break;
    /* charades */
    case 'chStart':S.ch.stage='play';S.ch.got=[];S.ch.skip=[];S.ch.end=Date.now()+S.ch.dur*1000;chNext();emitState();render();break;
    case 'chGot':S.ch.got.push(S.ch.cur);beep(880,.15);chNext();render();break;
    case 'chSkip':S.ch.skip.push(S.ch.cur);chNext();render();break;
    case 'chSwap':S.ch.team=1-S.ch.team;emitState();render();break;
    case 'chNextTeam':S.ch.team=1-S.ch.team;S.ch.stage='ready';emitState();render();break;
    /* buzz */
    case 'bzNext':S.bz.qi++;S.bz.r++;S.bz.open=true;S.bz.order=[];S.bz.showA=false;S.bz.awarded=false;emitState();render();break;
    case 'bzAns':S.bz.showA=true;render();break;
    case 'drawStart':{if(S.drawQ.length)break;const un=phonePlayers().filter(p=>p.team===null).map(p=>p.key);S.drawQ=shuffle(un);drawStep();break}
    case 'drawRedo':if(b.dataset.confirm!=='1'){b.dataset.confirm='1';b.textContent='متأكد؟ الفرق الحالية بتنمسح';break}S.draw.assign={};saveDraw();emitState();render();break;
    case 'drawSwap':{const k=b.dataset.k,t=teamOfKey(k);if(t===null)break;S.draw.assign[k]=1-t;S.drawLast=k;saveDraw();emitState();render();break}
    case 'bellOpen':S.bz.r++;S.bz.open=true;S.bz.order=[];S.bz.awarded=false;emitState();render();break;
    case 'bzToggle':S.bz.open=!S.bz.open;if(S.bz.open){S.bz.r++;S.bz.order=[]}emitState();render();break;
    case 'bzAward':{const o=S.bz.order[+b.dataset.i];S.teams[o.team].score++;S.bz.awarded=true;S.bz.open=false;saveTeams();emitState();toast('نقطة لـ '+S.teams[o.team].name);render();break}
    /* admin */
    case 'admin':openAdmin();break;
    case 'adminIn':if(window.lamma)lamma.adminSignIn().catch(()=>toast('ما تم الدخول. جرّب مرة ثانية.'));break;
    case 'adminOut':if(window.lamma)lamma.adminSignOut();break;
    case 'adminClose':D=null;S.view='home';emitState();render();break;
    case 'adminSave':saveAdmin();break;
    case 'tab':S.tab=b.dataset.v;render();break;
    case 'jgOpen':S.jgFrom=S.view==='judging'?S.jgFrom:S.view;
      if(!S.jg||(!Object.keys(S.jg.votes).length&&!S.jg.revealed&&JSON.stringify([S.jg.comms,S.jg.crit])!==JSON.stringify([C.comms,C.crit])))newJg();
      S.view='judging';closeBuzz();jgCollect();if(S.jg.ready&&!S.jg.revealed)jgReveal();emitState();render();window.scrollTo({top:0});break;
    case 'jgBack':S.view=S.jgFrom&&!['judging','admin'].includes(S.jgFrom)?S.jgFrom:'home';emitState();render();break;
    case 'jgReset':if(b.dataset.confirm!=='1'&&S.jg&&Object.keys(S.jg.votes).length){b.dataset.confirm='1';b.textContent='متأكد؟ الأصوات الحالية بتنمسح';break}
      if(!C.comms.length){S.jg=null;LS.set('jg',null);render();break}newJg();emitState();render();break;
    case 'tryFanfare':fanfare();break;
    case 'sndDel':D.winSound=null;S.saveOk=true;S.saveMsg='انشال الصوت من المسودة — اضغط «احفظ» لتثبيته.';render();break;
    case 'jgWipe':if(b.dataset.confirm!=='1'){b.dataset.confirm='1';b.textContent='متأكد؟ اضغط مرة ثانية';break}S.jg=null;LS.set('jg',null);S.saveOk=true;S.saveMsg='انمسحت النتيجة. التصويت الجاي يبدأ من الصفر.';emitState();render();break;
    case 'jEdit':J.editing=true;render();break;
    case 'jPick':J.c=+b.dataset.c;render();break;
    case 'jSend':{const g=P.host&&P.host.jg;if(!g||!g.open||!Number.isInteger(J.c))break;J.sent=true;J.editing=false;sendJudge({k:g.k,c:J.c});try{navigator.vibrate&&navigator.vibrate(60)}catch(_){}render();window.scrollTo({top:0});break}
    case 'jpinOff':D.judgePin='';D.jpinNew='';S.saveOk=true;S.saveMsg='انشال رمز اللجنة من المسودة — اضغط «احفظ» لتثبيته.';render();break;
    case 'ppinOff':D.playerPin='';D.ppinNew='';S.saveOk=true;S.saveMsg='انشال رمز اللاعبين من المسودة — اضغط «احفظ» لتثبيته.';render();break;
    case 'pinOff':D.hostPin='';D.pinNew='';S.saveOk=true;S.saveMsg='انشال الرقم من المسودة — اضغط «احفظ» لتثبيته.';render();break;
    case 'adminDefaults':Object.assign(D,gamesDraft(normalize(DEFAULTS)));S.saveOk=true;S.saveMsg='رجعنا الكلمات والأسئلة الأصلية في المسودة — اضغط «احفظ» لتثبيتها.';render();break;
    case 'catAdd':D.cats.push({name:'',words:''});S.saveMsg='';render();{const i=document.getElementById('a_cn'+(D.cats.length-1));if(i)i.focus()}break;
    case 'catDel':D.cats.splice(+b.dataset.i,1);S.saveMsg='';render();break;
    case 'evNew':D.events.push({title:'فعالية جديدة',subtitle:'',intro:'',outro:'',rounds:[{title:'الجولة الأولى',desc:'',timer:0,items:[{team:'A',q:'',a:'',qm:null,am:null,link:''}]}]});S.edEv=D.events.length-1;S.openR=0;S.saveMsg='';render();break;
    case 'evDel':if(b.dataset.confirm!=='1'){b.dataset.confirm='1';b.textContent='متأكد؟ اضغط مرة ثانية للحذف';break}D.events.splice(S.edEv,1);S.edEv=0;S.openR=-1;S.saveMsg='انحذفت من المسودة — اضغط «احفظ» لتثبيت الحذف.';S.saveOk=true;render();break;
    case 'rOpen':{const i=+b.dataset.i;S.openR=S.openR===i?-1:i;render();break}
    case 'rAdd':{const rs=D.events[S.edEv].rounds;rs.push({title:'جولة جديدة',desc:'',timer:0,items:[{team:'A',q:'',a:'',qm:null,am:null,link:''}]});S.openR=rs.length-1;render();break}
    case 'rDel':{if(b.dataset.confirm!=='1'){b.dataset.confirm='1';b.textContent='متأكد؟';break}D.events[S.edEv].rounds.splice(+b.dataset.i,1);S.openR=-1;render();break}
    case 'rMove':{const rs=D.events[S.edEv].rounds,i=+b.dataset.i,j=i+ +b.dataset.d;if(j<0||j>=rs.length)break;[rs[i],rs[j]]=[rs[j],rs[i]];if(S.openR===i)S.openR=j;else if(S.openR===j)S.openR=i;render();break}
    case 'iAdd':{const r=D.events[S.edEv].rounds[+b.dataset.r];const last=r.items[r.items.length-1];r.items.push({team:last?(last.team==='A'?'B':last.team==='B'?'A':last.team):'A',q:'',a:'',qm:null,am:null,link:''});render();break}
    case 'iDel':D.events[S.edEv].rounds[+b.dataset.r].items.splice(+b.dataset.i,1);render();break;
    case 'mDel':{const p=b.dataset.p.split('.');const o=p.slice(0,-1).reduce((x,k)=>x[k],D);o[p[p.length-1]]=null;S.saveMsg='';render();break}
    /* player */
    case 'pteam':P.team=+b.dataset.t;LS.set('pteam',P.team);if(P.joined)sendPresence();render();break;
    case 'flip':P.revealed=!P.revealed;render();break;
    case 'buzz':if(!P.host||!P.host.buzz)break;P.buzzedR=P.host.buzz.r;sendPresence({buzz:{r:P.host.buzz.r,t:Date.now()}});try{navigator.vibrate&&navigator.vibrate(80)}catch(_){}render();break;
  }
});
function setDraft(path,val){const k=path.split('.');let o=D;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=val}
let draftTimer=null;
$app.addEventListener('input',e=>{
  const t=e.target;if(!t.matches('[data-d]')||!D)return;
  setDraft(t.dataset.d,t.type==='checkbox'?t.checked:t.value);S.saveMsg='';
  if(t.dataset.d.startsWith('events.'))return; // no re-render while typing event fields
  clearTimeout(draftTimer);draftTimer=setTimeout(()=>{if(S.view==='admin')render()},600);
});
$app.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target.dataset.form;
  if(f==='addLocal'){const i=document.getElementById('newName');const n=clean(i.value);if(!n)return;if(S.localsExample){S.locals=[];S.localsExample=false}S.locals.push(n);LS.set('locals',S.locals);i.value='';render()}
  if(f==='judge'){J.name='عضو لجنة التقييم';
    if(!judgeAllowed()){const pi=document.getElementById('jpinIn');const v=pi?pi.value.trim():'';if(!v){S.pinMsg='اكتب رمز اللجنة.';render();return}joinJudge(v);return}
    J.joined=true;S.pinMsg='';sendJudge();render();return}
  if(f==='pin'){const v=document.getElementById('pinIn').value.trim();if(v)checkPin(v);return}
  if(f==='join'){const n=clean(document.getElementById('pname').value);if(!n){toast('اكتب اسمك');return}P.name=n;LS.set('pname',n);
    if(!playerAllowed()){const pi=document.getElementById('ppinIn');const v=pi?pi.value.trim():'';if(!v){S.pinMsg='اكتب رمز الدخول.';render();return}joinWithPin(v);return}
    P.joined=true;S.pinMsg='';sendPresence();render()}
});
$app.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('[data-up]')&&t.files&&t.files[0]){uploadMedia(t.dataset.up,t.files[0]);return}
  if(t.matches('[data-snd]')&&t.files&&t.files[0]){uploadSound(t.files[0]);return}
  if(t.matches('[data-edev]')){S.edEv=+t.value;S.openR=-1;render();return}
  if(t.matches('[data-d]')&&D){setDraft(t.dataset.d,t.type==='checkbox'?t.checked:(t.dataset.d.endsWith('.timer')?+t.value:t.value));if(t.tagName==='SELECT'||t.type==='checkbox'||t.dataset.d.endsWith('.title'))render();return}
  if(t.matches('[data-team-name]')){S.teams[+t.dataset.teamName].name=clean(t.value)||S.teams[+t.dataset.teamName].name;saveTeams();emitState()}
  if(t.matches('[data-spycat]'))S.spyCat=t.value;
  if(t.matches('[data-chdur]'))S.ch.dur=+t.value;
});
render();loadContent();initRoom();initUser();
</script>
